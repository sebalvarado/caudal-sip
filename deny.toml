[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "sqlx", wrappers = ["caudal-ledger-postgres"] },
    { crate = "tokio", wrappers = ["caudal-ledger-postgres", "sqlx-core", "sqlx-macros-core", "tokio-stream"] },
    { crate = "axum" },
    { crate = "hyper" },
    { crate = "rustls" },
    { crate = "quick-xml", wrappers = ["caudal-iso20022"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
