name: deploy

on:
  push:
    branches: [main]
    paths: ['apps/**', 'crates/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'Dockerfile', '.dockerignore', 'infra/azure/**', '.github/workflows/deploy.yml']
  pull_request:
    paths: ['apps/**', 'Dockerfile', '.dockerignore', 'infra/azure/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/caudal-demo

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Signs in with OIDC; the repository holds only non-secret ids as variables.
  # Without them (forks), the job is skipped.
  azure:
    needs: image
    if: github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the container app
        run: |
          url=$(az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/azure/main.bicep \
            --parameters name="${{ vars.AZURE_APP_NAME || 'caudal-demo' }}" \
                         image="${{ env.IMAGE }}:${{ github.sha }}" \
                         siteOrigin="${{ vars.SITE_URL || 'https://caudal-sip.pages.dev' }}" \
            --query properties.outputs.url.value -o tsv)
          echo "Demo API: $url" >> "$GITHUB_STEP_SUMMARY"
