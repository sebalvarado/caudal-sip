name: site

on:
  push:
    branches: [main]
    # `docs/**` is included because the site renders reference documents straight
    # from it (see site/src/content.config.ts) — a docs edit changes the site.
    paths: ['site/**', 'docs/**', '.github/workflows/site.yml']
  # No path filter here: `build` is a required check on main, so it has to
  # report on every pull request, including docs-only ones.
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Check the deploy artifact has the pages we expect
        run: |
          for f in index.html manifiesto/index.html estandar/index.html simulador/index.html simulador/worker.js simulador/pkg/caudal_bg.wasm simulacion/index.html blog/index.html rss.xml sitemap-index.xml llms.txt; do
            test -s "dist/$f" || { echo "missing or empty: dist/$f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
