[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/sebalvarado/caudal-sip"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
caudal-types = { path = "crates/types" }
caudal-ledger = { path = "crates/ledger" }

cargo_metadata = "0.23"
jiff = { version = "0.2", default-features = false, features = ["std"] }
pollster = "1"
proptest = "1"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "macros", "uuid"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = "1"
