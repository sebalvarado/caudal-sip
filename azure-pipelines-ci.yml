# Rust CI on Azure Pipelines (ADR-0019). The same checks as `just ci`; the site
# build stays in .github/workflows/site.yml. The pipeline is registered by
# infra/azure-devops.
trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

variables:
  CARGO_TERM_COLOR: always
  CARGO_HOME: $(Pipeline.Workspace)/.cargo
  CARGO_DENY_VERSION: 0.20.2

jobs:
  - job: dco
    displayName: DCO sign-off
    condition: eq(variables['Build.Reason'], 'PullRequest')
    steps:
      - checkout: self
        fetchDepth: 0
      - bash: |
          set -euo pipefail
          target="${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
          git fetch --quiet origin "+refs/heads/$target:refs/remotes/origin/$target"
          missing=0
          for c in $(git rev-list --no-merges "origin/$target..HEAD"); do
            if ! git show -s --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "##vso[task.logissue type=error]$(git show -s --format='%h %s' "$c") has no Signed-off-by (use git commit -s)"
              missing=1
            fi
          done
          exit $missing
        displayName: Every commit is signed off

  # Skips the Rust job until the Cargo workspace exists (#5).
  - job: detect
    displayName: Detect the Cargo workspace
    steps:
      - checkout: self
        fetchDepth: 1
      - bash: |
          present=false
          [ -f Cargo.toml ] && present=true
          echo "Cargo workspace present: $present"
          echo "##vso[task.setvariable variable=present;isOutput=true]$present"
        name: workspace

  - job: rust
    displayName: Rust
    dependsOn: detect
    condition: eq(dependencies.detect.outputs['workspace.present'], 'true')
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
    variables:
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - checkout: self
        fetchDepth: 1

      - bash: echo "##vso[task.prependpath]$(CARGO_HOME)/bin"
        displayName: Put cargo-installed tools on PATH

      - task: Cache@2
        inputs:
          key: 'cargo-registry | "$(Agent.OS)" | Cargo.lock'
          restoreKeys: |
            cargo-registry | "$(Agent.OS)"
          path: $(CARGO_HOME)/registry
        displayName: Cache the Cargo registry

      - task: Cache@2
        inputs:
          key: 'cargo-target | "$(Agent.OS)" | rust-toolchain.toml | Cargo.lock'
          restoreKeys: |
            cargo-target | "$(Agent.OS)" | rust-toolchain.toml
          path: target
        displayName: Cache target/

      - task: Cache@2
        inputs:
          key: 'cargo-deny | "$(Agent.OS)" | $(CARGO_DENY_VERSION)'
          path: $(CARGO_HOME)/bin
        displayName: Cache cargo-deny

      - bash: |
          set -euo pipefail
          rustup toolchain install
          rustup component add rustfmt clippy
          command -v cargo-deny || cargo install --locked cargo-deny --version "$(CARGO_DENY_VERSION)"
        displayName: Toolchain

      - bash: cargo fmt --all --check
        displayName: cargo fmt

      - bash: cargo clippy --workspace --all-targets -- -D warnings
        displayName: cargo clippy

      - bash: cargo test --workspace
        displayName: cargo test

      - bash: cargo deny check
        displayName: cargo deny
